name: Build and Release Nightly

on:
  push:
  pull_request:
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: read

jobs:
  check:
    name: Check on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config lld

      - name: Cargo Check
        run: |
          cargo update
          cargo check

  prepare-release:
    name: Prepare release
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reset Nightly Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: "Asia/Shanghai"
        run: |
          DATE=$(date +'%Y%m%d')
          COMMIT_SHORT="${GITHUB_SHA::7}"

          gh release delete nightly --cleanup-tag --yes --repo "${{ github.repository }}" || true

          gh release create nightly \
            --title "Nightly Build ($DATE)" \
            --notes "Auto-built from commit $COMMIT_SHORT." \
            --prerelease \
            --target ${{ github.sha }} \
            --repo "${{ github.repository }}"

  build-and-upload:
    name: Build Release on ${{ matrix.os }}
    if: github.event_name == 'schedule'
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            ext: so
          - os: windows-latest
            target_os: windows
            ext: dll
          - os: macos-latest
            target_os: macos
            ext: dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config lld

      - name: Build Release
        run: |
          cargo update
          cargo build --release

      - name: Rename and Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          MATCHES=(target/release/*xian_web_engine.${{ matrix.ext }})
          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            echo "Expected exactly 1 build artifact, found ${#MATCHES[@]}: ${MATCHES[*]}" >&2
            exit 1
          fi
          SRC_FILE="${MATCHES[0]}"
          NEW_NAME="xian-web-engine-${{ matrix.target_os }}.${{ matrix.ext }}"

          gh release upload nightly "$SRC_FILE#$NEW_NAME" --clobber
